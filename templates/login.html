<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operasyon Girişi | Tır & Rampa Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-100">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Dekoratif Arka Plan Işığı -->
        <div class="absolute -top-12 -right-12 w-36 h-36 bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-6">
            <div class="inline-block bg-white p-2.5 rounded-2xl shadow-lg mb-3">
                <img src="/static/img/logo.png" alt="Sistem Gümrük Müşavirliği" class="h-10 sm:h-12 w-auto object-contain">
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Operasyon Girişi</h2>
            <p class="text-xs text-slate-400 mt-1">Saha ve Rampa Yönetim Paneli</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                    Kullanıcı Adı
                </label>
                <div class="relative">
                    <input type="text" id="username" name="username" required autocomplete="username"
                        value="sistem"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm">
                    <i data-lucide="user" class="w-5 h-5 text-slate-400 absolute left-3 top-3.5"></i>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                    Şifre
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm">
                    <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3 top-3.5"></i>
                </div>
            </div>

            <div id="loginError" class="hidden p-3 bg-red-950/80 border border-red-800 text-red-300 text-xs rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i>
                <span id="loginErrorText">Hatalı kullanıcı adı veya şifre!</span>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 text-sm">
                <span>Giriş Yap</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-700/60 text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-blue-400 transition inline-flex items-center gap-1.5">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Şoför Araç Kayıt Formuna Dön</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginErrorText = document.getElementById('loginErrorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Kontrol ediliyor...</span>';
            lucide.createIcons();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/operasyon';
                } else {
                    loginErrorText.textContent = data.message || 'Giriş başarısız oldu.';
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                loginErrorText.textContent = 'Bağlantı hatası, lütfen tekrar deneyin.';
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Giriş Yap</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
